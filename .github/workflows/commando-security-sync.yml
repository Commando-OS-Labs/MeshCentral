name: Commando upstream security review

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/Ylianst/MeshCentral.git 2>/dev/null || git remote set-url upstream https://github.com/Ylianst/MeshCentral.git
          git fetch --no-tags upstream master
      - name: Record drift
        id: drift
        run: |
          count="$(git rev-list --count HEAD..upstream/master)"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse upstream/master)" >> "$GITHUB_OUTPUT"
          echo "current=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open or update review issue
        if: steps.drift.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          DRIFT_COUNT: ${{ steps.drift.outputs.count }}
          UPSTREAM_SHA: ${{ steps.drift.outputs.upstream }}
          CURRENT_SHA: ${{ steps.drift.outputs.current }}
        with:
          script: |
            const title = "Weekly MeshCentral upstream security review";
            const body = [
              `Upstream is ${process.env.DRIFT_COUNT} commit(s) ahead of the Commando fork.`,
              "",
              `- Current: \`${process.env.CURRENT_SHA}\``,
              `- Upstream: \`${process.env.UPSTREAM_SHA}\``,
              "- Review upstream security advisories and release notes.",
              "- Do not merge automatically; qualify the pinned candidate according to commando/UPSTREAM.md.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 10,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
